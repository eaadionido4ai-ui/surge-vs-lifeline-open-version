    '<svg viewBox="0 0 16 16"><path d="M8 3.2 C6.3 2.2 3.4 2.2 2.3 2.8 V12.7 C3.4 12.1 6.3 12.1 8 13.1 C9.7 12.1 12.6 12.1 13.7 12.7 V2.8 C12.6 2.2 9.7 2.2 8 3.2 Z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 3.2 V13.1" stroke="currentColor" stroke-width="1.2"/></svg></button>';
}
function drawFig3d(holder, pose, color, sites){
  var W = 240, H = 280, pad = 30;
  var J = poseJoints3d(pose), pts = {}, xs = [], ys = [];
  for (var k in J){ var r = rotX3d(rotY3d(J[k], yaw3d), pitch3d); var px = r[0], py = -r[1]; pts[k] = [px, py]; xs.push(px); ys.push(py); }
  var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs), miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
  var rw = (maxx - minx) || 1, rh = (maxy - miny) || 1, sc = Math.min((W - 2*pad)/rw, (H - 2*pad)/rh);
  var cx = W/2 - (minx + maxx)/2 * sc, cy = H/2 - (miny + maxy)/2 * sc;
  function X(k){ return (pts[k][0]*sc + cx).toFixed(1); }
  function Y(k){ return (pts[k][1]*sc + cy).toFixed(1); }
  var lines = BONES3D.map(function(b){ return '<line x1="' + X(b[0]) + '" y1="' + Y(b[0]) + '" x2="' + X(b[1]) + '" y2="' + Y(b[1]) + '"/>'; }).join('');
  var joints = Object.keys(pts).map(function(k){ return '<circle class="jt" cx="' + X(k) + '" cy="' + Y(k) + '" r="2.4"/>'; }).join('');
  var head = '<circle class="hd" cx="' + X('head') + '" cy="' + Y('head') + '" r="' + (0.14*sc).toFixed(1) + '"/>';
  var marks = '';
  var hr = (0.19*sc).toFixed(1), rr = (0.135*sc).toFixed(1);
  (sites || []).forEach(function(rg){
    var p = sitePoint3d(J, rg); if (!p) return;
    var r = rotX3d(rotY3d(p, yaw3d), pitch3d);
    var sx = (r[0]*sc + cx).toFixed(1), sy = (-r[1]*sc + cy).toFixed(1);
    marks += '<circle class="inj-halo" cx="' + sx + '" cy="' + sy + '" r="' + hr + '"/>' +
             '<circle class="inj-ring" cx="' + sx + '" cy="' + sy + '" r="' + rr + '"/>';
  });
  holder.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="fig3d-svg" style="color:' + color + '">' + lines + head + joints + marks + '</svg>';
}
function pose3dFor(c){
  if (c.status === 'deceased') return 'lie';
  if (!c.vitals.ambulatory && c.vitals.breathing && c.vitals.obeys) return 'sit';
  if (!c.vitals.ambulatory) return 'lie';
  return 'stand';
}
function mount3d(){
  var holder = document.getElementById('fig3d'); if (!holder) return;
  var c = ((S.sim && S.sim.cas) || []).filter(function(x){ return x.cid === S.viewer3d; })[0];
  if (!c){ S.viewer3d = null; return; }
  var pose = pose3dFor(c), color = casColor(c), sites = injurySites(c);
  drawFig3d(holder, pose, color, sites);
  var dragging = false, lx = 0, ly = 0;
  holder.onpointerdown = function(e){ dragging = true; lx = e.clientX; ly = e.clientY; if (holder.setPointerCapture) holder.setPointerCapture(e.pointerId); };
  holder.onpointermove = function(e){ if (!dragging) return; yaw3d += (e.clientX - lx)*0.012; pitch3d += (e.clientY - ly)*0.012;
    pitch3d = Math.max(-1.2, Math.min(1.2, pitch3d)); lx = e.clientX; ly = e.clientY; drawFig3d(holder, pose, color, sites); };
  holder.onpointerup = function(){ dragging = false; };
  holder.onpointerleave = function(){ dragging = false; };
}
function genderOf(person){ var p = String(person || '');
  if (/wom[ae]n|female|girl|\bshe\b|\bher\b/i.test(p)) return 'female';
  if (/\bm[ae]n\b|male|\bboy\b|\bhe\b|\bhis\b/i.test(p)) return 'male';
  return 'neutral'; }
function genderIcon(g){

      '<div class="ccard-fig' + (c.status!=='transit'?' clickable':'') + '"' + (c.status!=='transit'?' data-act="victim-view" data-val="' + c.cid + '"':'') + '>' + fig + (c.status!=='transit'?'<span class="fig3d-badge">3D</span>':'') + (c.child?'<span class="ch-tag">Child</span>':'') + '</div>' +

function section(title, list, note){

function viewBoard(){

  g.waiting.sort(function(x,y){ var a = sev[x.playerTag]-sev[y.playerTag]; if (a) return a; return (x.clock==null?1e9:x.clock)-(y.clock==null?1e9:y.clock); });
  g.scene.sort(function(x,y){ return (x.clock==null?1e9:x.clock)-(y.clock==null?1e9:y.clock); });

    content = dashboardView();

    var resolvedList = g.resolved.length
      ? '<section class="bsec"><div class="bsec-h"><span>Resolved</span><span class="bsec-n mono">' + g.resolved.length + '</span></div><div class="rgrid">' +
        g.resolved.map(function(c){
          var cls = (c.status==='deceased') ? (c.outcome==='died'?'r-died':'r-dead') : 'r-alive';

function triageErrorBlock(rep){
  if (!rep.mistriaged.length){
    return '<section class="card ok-edge"><p class="eyebrow">Triage check</p><p>Every casualty you tagged was sorted correctly. That is the standard to hold.</p></section>';
  }
  var rows = rep.mistriaged.map(function(e){
    return '<div class="errrow ' + (e.dir==='under'?'under':'over') + '">' +

function reportText(){
  var sim = S.sim, rep = buildReport(sim), vd = verdict(sim && rep), p = sim.participant, db = dashboard(sim), L = [];
  L.push('SURGE VS. LIFELINE, AFTER ACTION REPORT');

  if (p && (p.name||p.role||p.org||p.team)){
    if (p.name) L.push('Name: ' + p.name);
    if (p.role) L.push('Role: ' + p.role);
    if (p.org) L.push('Organization: ' + p.org);
    if (p.team) L.push('Team: ' + p.team);
    L.push('');
  }
  L.push('Incident: ' + sim.scaleName + ' | ' + sim.modeName + ' | ' + rep.n + ' casualties | ' + fmtClock(rep.elapsed));
  L.push('Session code: ' + sim.seed);
  L.push('');
  L.push('OUTCOMES');
  L.push('  Alive: ' + rep.alive);
  L.push('  Preventable deaths: ' + rep.preventable);
  L.push('  Deceased on arrival: ' + rep.deadOnArrival);
  L.push('  Immediate (red) saved: ' + rep.redsSaved + ' of ' + rep.redTotal);
  L.push('');
  L.push('TRIAGE');
  L.push('  Accuracy: ' + rep.tagAcc + '% (' + rep.exact + ' of ' + rep.triagedCount + ')');
  L.push('  Under-triage: ' + rep.underRate + '% (target under 5%)');
  L.push('  Over-triage: ' + rep.overRate + '%');
  L.push('  Vitals measured on: ' + rep.assessedCount + ' of ' + rep.n);
  if (rep.accWithVitals!=null) L.push('  Accuracy after measuring: ' + rep.accWithVitals + '%');
  if (rep.accBlind!=null) L.push('  Accuracy tagging on sight: ' + rep.accBlind + '%');
  L.push('');
  L.push('TRIAGE ERRORS');
  if (!rep.mistriaged.length) L.push('  None, every tag was correct.');
  else rep.mistriaged.forEach(function(e){ L.push('  ' + e.code + '  you tagged ' + e.playerTag + ', should be ' + e.trueTag + '  (' + e.dir + '-triage)'); });

  db.delivered.forEach(function(r){ L.push('  ' + r.code + '  ' + (r.tag||'') + '  at ' + fmtClock(r.at)); });
  if (!db.delivered.length) L.push('  none');
  L.push('');
  L.push('READ OF THE INCIDENT');
  L.push('  ' + vd.text);
  return L.join('\n');
}

/* ---------------- PDF export (self-contained, no library) ---------------- */
function pdfEsc(s){ return String(s).replace(/[^\x20-\x7E\xA0-\xFF]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function pdfWrap(text, max){
  var words = String(text).split(/\s+/), lines = [], line = '';
  words.forEach(function(w){
    if ((line ? line + ' ' + w : w).length > max){ if (line) lines.push(line); line = w; }
    else line = line ? line + ' ' + w : w;
  });
  if (line) lines.push(line); return lines;
}
function buildReportLines(){
  var sim = S.sim, rep = buildReport(sim), vd = verdict(rep), p = sim.participant, db = dashboard(sim), out = [];
  var deliveredLabel = sim.mode === 'sar' ? 'Evacuated to safety' : 'Reached hospital';
  var meanLabel = sim.mode === 'sar' ? 'Mean time to safety, reds' : 'Mean time to hospital, reds';
  function line(t, o){ o = o || {}; out.push({ t:t, b:!!o.b, size:o.size||10.5, indent:o.indent||0, before:o.before||0, gap:o.gap||0 }); }
  function head(t){ line(t, { b:true, size:11.5, before:8, gap:2 }); }
  line('Surge vs. Lifeline', { b:true, size:19, gap:2 });

}
function makePdf(lines){
  var pageW = 612, pageH = 792, mL = 54, mT = 56, mB = 54;
  var pages = [], cur = [], y = pageH - mT;
  lines.forEach(function(ln){
    var size = ln.size || 10.5;
    if (ln.before) y -= ln.before;
    var adv = size * 1.35 + (ln.gap || 0);
    if (y - size * 1.35 < mB){ pages.push(cur); cur = []; y = pageH - mT; }
    if (ln.t !== '') cur.push({ t:ln.t, b:ln.b, size:size, x:mL + (ln.indent || 0), y:y });
    y -= adv;
  });
  pages.push(cur);
  var objs = [];
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  var num = 5, kids = [];
  pages.forEach(function(pg){
    var content = '';
    pg.forEach(function(o){
      content += 'BT /' + (o.b ? 'F2' : 'F1') + ' ' + o.size + ' Tf ' + o.x.toFixed(1) + ' ' + o.y.toFixed(1) + ' Td (' + pdfEsc(o.t) + ') Tj ET\n';
    });
    var contentNum = num++, pageNum = num++;
    objs[contentNum] = '<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream';
    objs[pageNum] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + contentNum + ' 0 R >>';
    kids.push(pageNum);
  });
  objs[2] = '<< /Type /Pages /Kids [' + kids.map(function(k){ return k + ' 0 R'; }).join(' ') + '] /Count ' + kids.length + ' >>';
  var pdf = '%PDF-1.4\n', offsets = [], maxObj = num - 1, i;
  for (i = 1; i <= maxObj; i++){ offsets[i] = pdf.length; pdf += i + ' 0 obj\n' + objs[i] + '\nendobj\n'; }
  var xrefPos = pdf.length;
  pdf += 'xref\n0 ' + (maxObj + 1) + '\n0000000000 65535 f \n';
  for (i = 1; i <= maxObj; i++) pdf += ('0000000000' + offsets[i]).slice(-10) + ' 00000 n \n';
  pdf += 'trailer\n<< /Size ' + (maxObj + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF';
  var bytes = new Uint8Array(pdf.length);
  for (i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
  return new Blob([bytes], { type:'application/pdf' });
}
function exportPdf(){
  var a = document.createElement('a'); a.href = URL.createObjectURL(makePdf(buildReportLines()));
  var slug = (S.sim.participant && S.sim.participant.name ? S.sim.participant.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-' : '');

}

/* ============ Offline-first pilot feedback with Google Sheet sync ============
   Deployer: paste your Google Apps Script Web App URL below, or set it in the app
   under Send feedback, Configure sync (facilitator). Blank keeps feedback on the
   device until an endpoint is set. */
var FEEDBACK_ENDPOINT = '';
function fbEndpoint(){ return String(lsGet('svl_fb_endpoint') || FEEDBACK_ENDPOINT || '').trim(); }
function fbLoad(){ var raw = lsGet('svl_feedback'); if (raw){ try { var a = JSON.parse(raw); if (Array.isArray(a)) return a; } catch(e){} } return []; }
function fbSaveQueue(a){ lsSet('svl_feedback', JSON.stringify(a)); }
function fbCounts(){ var a = fbLoad(), p = 0, s = 0; a.forEach(function(x){ if (x.status === 'synced') s++; else p++; }); return { pending:p, synced:s, total:a.length }; }
function fbAdd(rec){ var a = fbLoad(); a.push(rec); fbSaveQueue(a); }
function fbSync(cb){
  var url = fbEndpoint(), a = fbLoad(), pend = a.filter(function(x){ return x.status !== 'synced'; });
  if (!url){ S.fb.status = 'No sync destination is set yet.'; if (cb) cb(); return; }
  if (!pend.length){ S.fb.status = 'Everything is already synced.'; if (cb) cb(); return; }
  if (typeof fetch === 'undefined' || (typeof navigator !== 'undefined' && navigator.onLine === false)){ S.fb.status = 'You are offline. Saved here and will sync later.'; if (cb) cb(); return; }
  S.fb.status = 'Syncing ' + pend.length + ' item' + (pend.length > 1 ? 's' : '') + '...';
  var done = 0, okc = 0;
  pend.forEach(function(rec){
    fetch(url, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(rec) })
      .then(function(){ rec.status = 'synced'; rec.syncedAt = Date.now(); okc++; })
      .catch(function(){})
      .then(function(){ done++; if (done === pend.length){ fbSaveQueue(a); var cc = fbCounts(); S.fb.status = okc + ' synced, ' + cc.pending + ' still pending.'; if (cb) cb(); } });
  });
}

    return '<div class="aff-row"><input class="tin" data-mi="' + i + '" data-ai="' + j + '" data-field="aff" value="' + esc(a) + '" placeholder="Affiliation">' +
      '<button class="btn btn-ghost tiny" data-act="team-del-aff" data-val="' + i + ':' + j + '">Remove</button></div>';
  }).join('');
  return '<div class="mem-card" data-mi="' + i + '">' +
    '<div class="mem-head"><span class="mem-head-l"><span class="mem-grip" title="Drag to reorder" aria-label="Drag to reorder"><svg viewBox="0 0 10 16" class="grip-svg"><circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/><circle cx="3" cy="8" r="1.3"/><circle cx="7" cy="8" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="7" cy="13" r="1.3"/></svg></span><span class="mem-n">Member ' + (i+1) + '</span></span>' +
      '<button class="btn btn-ghost tiny" data-act="team-del-member" data-val="' + i + '">Remove member</button></div>' +
    '<label class="tlbl">Name</label><input class="tin" data-mi="' + i + '" data-field="name" value="' + esc(m.name) + '" placeholder="Full name">' +
    '<label class="tlbl">Role</label><input class="tin" data-mi="' + i + '" data-field="role" value="' + esc(m.role) + '" placeholder="Role or position">' +
    '<label class="tlbl">Affiliations</label>' + affRows +
    '<button class="btn btn-ghost tiny addaff" data-act="team-add-aff" data-val="' + i + '">Add another affiliation</button>' +
  '</div>';
}
/* ---- Drag to reorder team members (touch and mouse) ---- */
function mountTeamDnD(){
  var box = document.getElementById('team-editor'); if (!box) return;
  var grips = box.querySelectorAll('.mem-grip');
  for (var i = 0; i < grips.length; i++){
    grips[i].onpointerdown = function(e){ e.preventDefault(); teamDragStart(box, this.closest('.mem-card'), e); };
  }
}
function teamDragStart(box, card, e){
  if (!card) return;
  var rect = card.getBoundingClientRect();
  var offY = e.clientY - rect.top, left = rect.left, width = rect.width, height = rect.height;
  var ph = document.createElement('div'); ph.className = 'mem-placeholder'; ph.style.height = height + 'px';
  box.insertBefore(ph, card);
  card.classList.add('dragging');
  card.style.position = 'fixed'; card.style.left = left + 'px'; card.style.width = width + 'px';
  card.style.top = (e.clientY - offY) + 'px'; card.style.margin = '0'; card.style.zIndex = '90'; card.style.pointerEvents = 'none';
  function move(ev){
    card.style.top = (ev.clientY - offY) + 'px';
    var sibs = box.querySelectorAll('.mem-card:not(.dragging)'), placed = false;
    for (var i = 0; i < sibs.length; i++){
      var r = sibs[i].getBoundingClientRect();
      if (ev.clientY < r.top + r.height / 2){ box.insertBefore(ph, sibs[i]); placed = true; break; }
    }
    if (!placed) box.appendChild(ph);
  }
  function up(){
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    card.classList.remove('dragging');
    card.style.position = ''; card.style.left = ''; card.style.width = ''; card.style.top = ''; card.style.margin = ''; card.style.zIndex = ''; card.style.pointerEvents = '';
    box.insertBefore(card, ph); box.removeChild(ph);
    harvestTeam();
    var order = [], cards = box.querySelectorAll('.mem-card');
    for (var i = 0; i < cards.length; i++){ order.push(parseInt(cards[i].getAttribute('data-mi'), 10)); }
    if (S.teamEdit && order.length === S.teamEdit.length && order.indexOf(NaN) < 0){
      S.teamEdit = order.map(function(idx){ return S.teamEdit[idx]; });
    }
    render();
  }
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
}

function viewCredits(){
  if (!S.team) S.team = loadTeam();
  var mode = S.creditsMode || 'view';
  var back = '<button class="btn btn-ghost" data-go="' + (S.unlocked ? 'about' : 'access') + '">Back</button>';
  var instHead =
    '<section class="card"><p class="eyebrow">Developed by</p>' +
      '<p class="cred-inst">University of the Philippines Resilience Institute (UPRI)</p>' +
      '<p class="cred-collab">in collaboration with</p>' +
      '<p class="cred-inst">University of the Philippines Manila Disaster Risk Reduction and Management in Health (UPM DRRM-H)</p></section>';
  var b;
  if (mode === 'auth'){
    b = instHead +
      '<section class="card"><p class="eyebrow">Edit the development team</p>' +
        '<p class="muted small">Editing is limited to facilitators. Enter your facilitator key to continue.</p>' +
        '<input id="team-key" class="tin" type="text" placeholder="Facilitator key" value="' + esc(S.teamAuthKey || '') + '">' +
        (S.teamAuthErr ? '<p class="err-line">' + esc(S.teamAuthErr) + '</p>' : '') +
        '<div class="cta-row"><button class="btn btn-primary" data-act="team-auth">Unlock editing</button>' +
        '<button class="btn btn-ghost" data-act="team-cancel">Cancel</button></div></section>';
  } else if (mode === 'edit'){
    var cards = S.teamEdit.map(creditMemberEdit).join('');
    b = '<section class="card"><p class="eyebrow">Editing team' + (S.teamEditBy ? ', signed in as ' + esc(S.teamEditBy) : '') + '</p>' +
        '<p class="muted small">Drag the grip at the left of a member to reorder the authors. The new order is kept when you tap Save changes.</p>' +
        '<div id="team-editor">' + cards + '</div>' +
        '<button class="btn btn-ghost addmem" data-act="team-add-member">Add a member</button></section>' +
      '<div class="cta-row"><button class="btn btn-primary" data-act="team-save">Save changes</button>' +
        '<button class="btn btn-ghost" data-act="team-cancel">Cancel</button>' +
        '<button class="btn btn-ghost" data-act="team-reset">Reset to default</button></div>';
  } else {
    var rows = S.team.map(creditMemberView).join('');
    b = instHead +
      '<section class="card"><p class="eyebrow">Development team</p><div class="cred-list">' + rows + '</div>' +
        '<button class="btn btn-ghost tiny editteam" data-act="team-edit-start">Edit team</button></section>' +
      '<section class="card"><p class="muted small">This is a training simulation, never a clinical or command decision aid for a real incident.</p></section>' +
      '<div class="cta-row">' + back + '</div>';
  }
  return shell('Credits', mode === 'edit' ? 'Editing the development team' : 'Developer acknowledgement', b);
}

function init(){
  S.unlocked = true;
  S.screen = 'about';
  render();
}
document.addEventListener('DOMContentLoaded', init);
